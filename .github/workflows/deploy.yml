name: deploy vaultdb.ai

on:
  workflow_dispatch:
  # Daily, so new registry entries reach the Agent Hub page without a push
  schedule:
    - cron: "0 2 * * *"
  repository_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - '**'
    paths-ignore:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  Deploy:
    name: Deploy VaultDB.ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Refresh the Agent Hub snapshot (js/catalog-data.js) from the VaultDB Nest
      # registry. Non-fatal: if the registry can't be fetched, the committed
      # snapshot is deployed as is.
      - name: Refresh Agent Hub catalog
        shell: bash
        run: node scripts/build-catalog.mjs || echo "Catalog refresh failed; deploying the committed snapshot"

      - name: Build distribution
        shell: bash
        run: |
            mkdir -p dist
            cp ./*.html ./dist/
            cp -r ./css ./dist/
            cp -r ./img ./dist/
            cp -r ./js ./dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.S3_ID }}
          aws-secret-access-key: ${{ secrets.S3_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Sync instead of wipe-and-upload: --delete removes pages that no longer
      # exist, and downloads/ (installers uploaded by the nest-app release
      # workflow) is excluded so a site deploy never deletes them.
      - name: Sync to S3
        shell: bash
        env:
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: aws s3 sync dist "s3://$AWS_BUCKET" --delete --exclude "downloads/*"

      # VaultDB Nest installers (downloads/nest/, see downloads/nest/README.md).
      # No --delete, so every older version stays downloadable. Order matters:
      # the installers go up before latest.json points the app and site at them.
      - name: Upload downloads to S3
        shell: bash
        env:
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: |
          aws s3 sync downloads "s3://$AWS_BUCKET/downloads" --exclude "*.msi" --exclude "*.md" --exclude "nest/latest.json"
          aws s3 sync downloads "s3://$AWS_BUCKET/downloads" --exclude "*" --include "*.msi" --content-type application/x-msi --content-disposition attachment
          aws s3 cp downloads/nest/latest.json "s3://$AWS_BUCKET/downloads/nest/latest.json" --cache-control "no-cache, max-age=0" --content-type application/json
